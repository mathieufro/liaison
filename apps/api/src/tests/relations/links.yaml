    visibleState: [usual]
    whoIsTold: [usual]
    copiedNameAt: []
    cells: { Rn: c, Mg: P, Dl: C, Dx: C, Pm: C, Ap: c, Mv: K, Rs: H, Dr: e, Ex: a, Mi: M, Rv: V, Aw: W }
    open:
      Mg: a request is routed to an import placeholder only through an import, which this file does not drive
      Rs: no route resolver reads a restricted document in this tree

